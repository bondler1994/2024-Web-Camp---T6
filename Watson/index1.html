<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <!-- flowbite -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
        <!-- css link -->
        <link rel="stylesheet" href="./src/output.css" />
        <link rel="stylesheet" href="./sass/sass.css" />
        <link rel="stylesheet" href="./css/Style1.css" />
        <!-- swiper -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
        <!-- google font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
            rel="stylesheet"
        />
        <!-- fontawesome -->
        <link
            rel="stylesheet"
            href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
            integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <div class="container all-container">
            <header>
                <div class="logo-area bg-white py-6 shadow-lg">
                    <!-- hamburger -->
                    <label class="hidden hamburger_toggler" for="hamburger"><i class="fas fa-bars"></i></label>
                    <!-- logo -->
                    <h1>
                        <a href="##">
                            <img src="./images/logo.png" alt="" />
                        </a>
                    </h1>
                </div>

                <!-- navbar -->
                <nav class="mt-3 flex text-center items-center justify-between" id="collapse">
                    <div class="nav-link gap-4 bg-white flex justify-between w-full">
                        <a href="##">HOME</a>
                        <a href="##">ABOUT</a>
                        <!-- feature -->
                        <button id="dropfeature" href="##" class="flex items-center" data-dropdown-toggle="feature">
                            FEATURES
                            <svg class="w-2.5 h-2.5 ms-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4" />
                            </svg>
                        </button>
                        <div id="feature" class="z-10 hidden font-normal bg-gray-300 divide-y divide-blue-400 shadow w-44">
                            <ul class="flex flex-col">
                                <a href="##" class="hover:bg-green-200">You</a>
                                <a href="##" class="hover:bg-green-200">Are</a>
                                <a href="##" class="hover:bg-green-200">Loser</a>
                            </ul>
                        </div>
                        <!-- PORTFOLIO -->
                        <button id="dropfeature" href="##" class="flex items-center" data-dropdown-toggle="PORTFOLIO">
                            PORTFOLIO
                            <svg class="w-2.5 h-2.5 ms-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4" />
                            </svg>
                        </button>
                        <div id="PORTFOLIO" class="z-10 hidden font-normal bg-gray-300 divide-y divide-blue-400 shadow w-44">
                            <ul class="flex flex-col">
                                <a href="##" class="hover:bg-green-200">You</a>
                                <a href="##" class="hover:bg-green-200">Are</a>
                                <a href="##" class="hover:bg-green-200">Loser</a>
                            </ul>
                        </div>
                        <!-- blog -->
                        <button id="dropfeature" href="##" class="flex items-center" data-dropdown-toggle="blog">
                            blog
                            <svg class="w-2.5 h-2.5 ms-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4" />
                            </svg>
                        </button>
                        <div id="blog" class="z-10 hidden font-normal bg-gray-300 divide-y divide-blue-400 shadow w-44">
                            <ul class="flex flex-col">
                                <a href="##" class="hover:bg-green-200">You</a>
                                <a href="##" class="hover:bg-green-200">Are</a>
                                <a href="##" class="hover:bg-green-200">Loser</a>
                            </ul>
                        </div>
                        <a href="##">CONTACTS</a>
                    </div>
                    <div class="flex flex-1">
                        <input type="search" class="flex ml-3 inline-block" placeholder="Search the Site..." />
                    </div>
                    <!-- <a href="tel:+1 (777) 784-25-43">Call Us Now: +1 (777) 784-25-43</a> -->
                </nav>
            </header>

            <main>
                <!-- carousel -->
                <div id="default-carousel" class="relative w-full" data-carousel="slide">
                    <!-- Carousel wrapper -->
                    <div class="relative h-56 overflow-hidden rounded-lg md:h-96">
                        <!-- Item 1 -->
                        <div class="hidden duration-700 ease-in-out" data-carousel-item>
                            <img
                                src="./images/banner1.jpg"
                                class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                                alt="..."
                            />
                        </div>
                        <!-- Item 2 -->
                        <div class="hidden duration-700 ease-in-out" data-carousel-item>
                            <img
                                src="./images/banner2.jpg"
                                class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                                alt="..."
                            />
                        </div>
                        <!-- Item 3 -->
                        <div class="hidden duration-700 ease-in-out" data-carousel-item>
                            <img
                                src="./images/banner3.jpg"
                                class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2"
                                alt="..."
                            />
                        </div>
                    </div>
                    <!-- Slider indicators -->
                    <div class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3 rtl:space-x-reverse">
                        <button
                            type="button"
                            class="w-3 h-3 rounded-full"
                            aria-current="true"
                            aria-label="Slide 1"
                            data-carousel-slide-to="0"
                        ></button>
                        <button
                            type="button"
                            class="w-3 h-3 rounded-full"
                            aria-current="false"
                            aria-label="Slide 2"
                            data-carousel-slide-to="1"
                        ></button>
                        <button
                            type="button"
                            class="w-3 h-3 rounded-full"
                            aria-current="false"
                            aria-label="Slide 3"
                            data-carousel-slide-to="2"
                        ></button>
                    </div>
                    <!-- Slider controls -->
                    <button
                        type="button"
                        class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
                        data-carousel-prev
                    >
                        <span
                            class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none"
                        >
                            <svg
                                class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180"
                                aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 6 10"
                            >
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 1 1 5l4 4" />
                            </svg>
                            <span class="sr-only">Previous</span>
                        </span>
                    </button>
                    <button
                        type="button"
                        class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
                        data-carousel-next
                    >
                        <span
                            class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none"
                        >
                            <svg
                                class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180"
                                aria-hidden="true"
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 6 10"
                            >
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4" />
                            </svg>
                            <span class="sr-only">Next</span>
                        </span>
                    </button>
                </div>
                <!-- carousel -->
            </main>
            <footer></footer>
        </div>
        <!-- swiper js -->
        <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
        <!-- flowbite -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
        <script>
            var mySwiper = new Swiper(".swiper-container", {
                // 參數設定[註1]
                direction: "horizontal", // 方向
                loop: true, // 循環
                pagination: {
                    el: ".swiper-pagination", // 分頁物件
                },
                navigation: {
                    nextEl: ".swiper-button-next", // 上一頁按鈕物件
                    prevEl: ".swiper-button-prev", // 下一頁按鈕物件
                },
                scrollbar: {
                    el: ".swiper-scrollbar", // 捲軸物件
                },
            });
        </script>
    </body>
</html>
