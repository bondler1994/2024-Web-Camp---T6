<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <!-- flowbite -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
        <!-- css link -->
        <link rel="stylesheet" href="./src/output.css" />
        <link rel="stylesheet" href="./sass/sass.css" />
        <link rel="stylesheet" href="./css/Style1.css" />
        <!-- swiper -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
        <!-- google font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
            rel="stylesheet"
        />
        <!-- fontawesome -->
        <link
            rel="stylesheet"
            href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
            integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <div class="container all-container">
            <header class="mt-3">
                <div class="logo-area bg-white p-8 shadow-lg">
                    <!-- hamburger -->
                    <label class="hidden hamburger_toggler" for="hamburger"><i class="fas fa-bars"></i></label>
                    <!-- logo -->
                    <h1>
                        <a href="##">
                            <img src="./images/logo.png" alt="" />
                        </a>
                    </h1>
                </div>
            </header>

            <!-- navbar -->
            <nav class="mt-8 flex text-center items-center justify-between" id="collapse">
                <div class="nav-link bg-white flex w-full">
                    <a href="##">HOME</a>
                    <a href="##">ABOUT</a>
                    <!-- feature -->
                    <button id="dropfeature" href="##" class="flex items-center" data-dropdown-toggle="feature">
                        FEATURES
                        <svg class="w-2.5 h-2.5 ms-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4" />
                        </svg>
                    </button>
                    <div id="feature" class="z-10 hidden font-normal bg-gray-300 divide-y divide-blue-400 shadow w-44">
                        <ul class="flex flex-col">
                            <a href="##" class="hover:bg-green-200">You</a>
                            <a href="##" class="hover:bg-green-200">Are</a>
                            <a href="##" class="hover:bg-green-200">Loser</a>
                        </ul>
                    </div>
                    <!-- PORTFOLIO -->
                    <button id="dropfeature" href="##" class="flex items-center" data-dropdown-toggle="PORTFOLIO">
                        PORTFOLIO
                        <svg class="w-2.5 h-2.5 ms-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4" />
                        </svg>
                    </button>
                    <div id="PORTFOLIO" class="z-10 hidden font-normal bg-gray-300 divide-y divide-blue-400 shadow w-44">
                        <ul class="flex flex-col">
                            <a href="##" class="hover:bg-green-200">You</a>
                            <a href="##" class="hover:bg-green-200">Are</a>
                            <a href="##" class="hover:bg-green-200">Loser</a>
                        </ul>
                    </div>
                    <!-- blog -->
                    <button id="dropfeature" href="##" class="flex items-center" data-dropdown-toggle="blog">
                        blog
                        <svg class="w-2.5 h-2.5 ms-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 10 6">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 4 4 4-4" />
                        </svg>
                    </button>
                    <div id="blog" class="z-10 hidden font-normal bg-gray-300 divide-y divide-blue-400 shadow w-44">
                        <ul class="flex flex-col">
                            <a href="##" class="hover:bg-green-200">You</a>
                            <a href="##" class="hover:bg-green-200">Are</a>
                            <a href="##" class="hover:bg-green-200">Loser</a>
                        </ul>
                    </div>
                    <a href="##">CONTACTS</a>
                </div>
                <form class="flex p-2 bg-white ml-3">
                    <input type="search" class="flex inline-block" placeholder="Search the Site..." />
                </form>
                <!-- <a href="tel:+1 (777) 784-25-43">Call Us Now: +1 (777) 784-25-43</a> -->
            </nav>

            <main>
                <!-- carousel -->
                <div id="carouselExampleControls" class="relative" data-twe-carousel-init data-twe-ride="carousel">
                    <!--Carousel items-->
                    <div class="relative w-full overflow-hidden after:clear-both after:block after:content-['']">
                        <!--First item-->
                        <div
                            class="relative float-left -mr-[100%] w-full transition-transform duration-[600ms] ease-in-out motion-reduce:transition-none"
                            data-twe-carousel-item
                            data-twe-carousel-active
                        >
                            <img src="https://mdbcdn.b-cdn.net/img/new/slides/041.webp" class="block w-full" alt="Wild Landscape" />
                        </div>
                        <!--Second item-->
                        <div
                            class="relative float-left -mr-[100%] hidden w-full transition-transform duration-[600ms] ease-in-out motion-reduce:transition-none"
                            data-twe-carousel-item
                        >
                            <img src="https://mdbcdn.b-cdn.net/img/new/slides/042.webp" class="block w-full" alt="Camera" />
                        </div>
                        <!--Third item-->
                        <div
                            class="relative float-left -mr-[100%] hidden w-full transition-transform duration-[600ms] ease-in-out motion-reduce:transition-none"
                            data-twe-carousel-item
                        >
                            <img src="https://mdbcdn.b-cdn.net/img/new/slides/043.webp" class="block w-full" alt="Exotic Fruits" />
                        </div>
                    </div>

                    <!--Carousel controls - prev item-->
                    <button
                        class="absolute bottom-0 left-0 top-0 z-[1] flex w-[15%] items-center justify-center border-0 bg-none p-0 text-center text-white opacity-50 transition-opacity duration-150 ease-[cubic-bezier(0.25,0.1,0.25,1.0)] hover:text-white hover:no-underline hover:opacity-90 hover:outline-none focus:text-white focus:no-underline focus:opacity-90 focus:outline-none motion-reduce:transition-none"
                        type="button"
                        data-twe-target="#carouselExampleControls"
                        data-twe-slide="prev"
                    >
                        <span class="inline-block h-8 w-8">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="1.5"
                                stroke="currentColor"
                                class="h-6 w-6"
                            >
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                            </svg>
                        </span>
                        <span class="!absolute !-m-px !h-px !w-px !overflow-hidden !whitespace-nowrap !border-0 !p-0 ![clip:rect(0,0,0,0)]"
                            >Previous</span
                        >
                    </button>
                    <!--Carousel controls - next item-->
                    <button
                        class="absolute bottom-0 right-0 top-0 z-[1] flex w-[15%] items-center justify-center border-0 bg-none p-0 text-center text-white opacity-50 transition-opacity duration-150 ease-[cubic-bezier(0.25,0.1,0.25,1.0)] hover:text-white hover:no-underline hover:opacity-90 hover:outline-none focus:text-white focus:no-underline focus:opacity-90 focus:outline-none motion-reduce:transition-none"
                        type="button"
                        data-twe-target="#carouselExampleControls"
                        data-twe-slide="next"
                    >
                        <span class="inline-block h-8 w-8">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="1.5"
                                stroke="currentColor"
                                class="h-6 w-6"
                            >
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                            </svg>
                        </span>
                        <span class="!absolute !-m-px !h-px !w-px !overflow-hidden !whitespace-nowrap !border-0 !p-0 ![clip:rect(0,0,0,0)]"
                            >Next</span
                        >
                    </button>
                </div>
            </main>
            <footer></footer>
        </div>
        <!-- swiper js -->
        <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
        <!-- flowbite -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
        <script>
            var mySwiper = new Swiper(".swiper-container", {
                // 參數設定[註1]
                direction: "horizontal", // 方向
                loop: true, // 循環
                pagination: {
                    el: ".swiper-pagination", // 分頁物件
                },
                navigation: {
                    nextEl: ".swiper-button-next", // 上一頁按鈕物件
                    prevEl: ".swiper-button-prev", // 下一頁按鈕物件
                },
                scrollbar: {
                    el: ".swiper-scrollbar", // 捲軸物件
                },
            });
        </script>
    </body>
</html>
